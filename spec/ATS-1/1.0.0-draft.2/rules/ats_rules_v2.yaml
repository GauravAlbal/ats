  - document_context
  - meaning_ledger
  protected_impact:
  - P2
  autofix: review_required
  waivable: true
  exceptions: []
  fixture_requirements: *id001
- schema_version: ats.rule.v1
  rule_id: ATS-PRES-002
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: Preserve retained P1 relations
  category: preservation
  normative_statement: A transformation MUST preserve all retained material P1 relations with the same
    type, direction, scope, and force.
  rationale: Conditions, qualifications, evidence links, and causal direction carry the conceptual model
    even when sentence wording changes.
  default_states:
    ASSESS: disabled
    SPECIFY: disabled
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D4
  required_inputs:
  - source_ir
  - output_ir
  - retention_contract
  - authorizations
  protected_impact:
  - P1
  autofix: forbidden
  waivable: false
  exceptions: []
