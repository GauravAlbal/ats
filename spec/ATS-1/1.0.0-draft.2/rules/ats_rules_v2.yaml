  - violation
  - hard_negative
  - exception
- schema_version: ats.rule.v1
  rule_id: ATS-PRES-003
  operational_class: block
  rule_version: 1.0.0-draft.2
  title: Preserve protected relations under compression
  category: preservation
  normative_statement: A transformation MUST NOT remove, weaken, strengthen, reverse, or make
    materially implicit a protected relation solely to reduce surface length,
    syntactic complexity, or repetition; surface compression remains permitted,
    semantic-relational compression does not.
  rationale: Compression must cut surface, never meaning; removing or weakening a
    protected relation trades reader cost for semantic loss, and the mission's
    primary objective of faithful low-cost recovery forbids that trade.
  default_states:
    ASSESS: advisory
    SPECIFY: advisory
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D1
  required_inputs:
  - source_ir
  - output_ir
  - trace
  - profile
  protected_impact:
  - P1
  autofix: forbidden
  waivable: false
  exceptions: []
  fixture_requirements:
  - conforming
  - violation
  - hard_negative
  - exception
- schema_version: ats.rule.v1
  rule_id: ATS-CLOSE-001
  operational_class: review_required
  rule_version: 1.0.0-draft.2
  title: Local semantic closure for extractable units
  category: closure
  normative_statement: 'An extractable normative unit MUST be locally closed: its operative meaning
    is recoverable from the unit plus explicitly declared dependencies, without
    undeclared document-wide inference.'
  rationale: Extractable units must stand alone so that sharding, retrieval, task and
    acceptance-criterion generation, and action selection recover operative
    meaning from the unit plus declared dependencies rather than from undeclared
    document-wide inference.
  default_states:
    ASSESS: advisory
    SPECIFY: required
    TRANSFORM: advisory
  severity: major
  detector_classes:
  - D1
  required_inputs:
  - ir_document
  - profile
  - requirement_ir
  protected_impact:
  - P1
  autofix: review_required
  waivable: true
  exceptions: []
