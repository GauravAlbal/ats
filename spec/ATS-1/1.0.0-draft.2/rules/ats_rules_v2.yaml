  rule_id: ATS-DISC-002
  operational_class: advisory
  rule_version: 1.0.0-draft.1
  title: One conceptual move per paragraph
  category: discourse
  normative_statement: A paragraph SHOULD perform one primary conceptual move.
  rationale: Conceptual moves provide better structure than arbitrary sentence or topic limits.
  default_states:
    ASSESS: advisory
    SPECIFY: advisory
