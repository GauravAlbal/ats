- schema_version: ats.rule.v1
  rule_id: ATS-DISC-001
  operational_class: advisory
  rule_version: 1.0.0-draft.1
  title: Lead with the load-bearing statement
  category: discourse
  normative_statement: The load-bearing judgment, requirement, or answer SHOULD precede background that
    cannot change its interpretation.
  rationale: Readers should not traverse irrelevant setup to discover the operative claim.
  default_states:
    ASSESS: advisory
    SPECIFY: advisory
