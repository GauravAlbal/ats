  rule_id: ATS-EPI-005
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: State confidence basis
  category: epistemics
  normative_statement: A material assessment-confidence label MUST include an inspectable basis and rationale.
  rationale: A confidence label without basis creates unsupported authority.
  default_states:
    ASSESS: required
    SPECIFY: advisory
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D1
  - D3
