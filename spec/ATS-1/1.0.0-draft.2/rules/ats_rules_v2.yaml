- schema_version: ats.rule.v1
  rule_id: ATS-REQ-002
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: One obligation per requirement
  category: requirements
  normative_statement: Every material requirement MUST contain one obligation unless multiple actions
    are proven indivisible under one acceptance criterion.
  rationale: Atomic obligations support independent implementation, testing, supersession, and failure
    diagnosis.
  default_states:
    ASSESS: disabled
    SPECIFY: required
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D1
  - D3
