- schema_version: ats.rule.v1
  rule_id: ATS-DEON-002
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: MAY means permission
  category: deontics
  normative_statement: '`MAY` MUST express permission, not probability or capability.'
  rationale: Permission, capability, and probability lead to different system behavior and authority.
  default_states:
    ASSESS: advisory
    SPECIFY: required
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D0
  - D3
  - D4
  required_inputs:
  - text
  - profile
  - meaning_ledger
  protected_impact:
  - P0
  autofix: review_required
  waivable: true
  exceptions: []
