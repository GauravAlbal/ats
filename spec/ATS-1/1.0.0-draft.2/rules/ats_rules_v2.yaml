  rule_id: ATS-EPI-004
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: Separate likelihood and assessment confidence
  category: epistemics
  normative_statement: Likelihood and assessment confidence MUST be represented as distinct fields or
    labeled sentences.
  rationale: Event probability and robustness of the analytic basis answer different questions.
  default_states:
    ASSESS: required
    SPECIFY: advisory
    TRANSFORM: required
  severity: critical
  detector_classes:
