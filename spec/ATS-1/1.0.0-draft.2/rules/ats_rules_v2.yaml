- schema_version: ats.rule.v1
  rule_id: ATS-EPI-003
  operational_class: review_required
  rule_version: 1.0.0-draft.1
  title: Do not mix probability vocabularies
  category: epistemics
  normative_statement: A section MUST NOT mix noncanonical WEP synonyms with canonical ATS-1 output unless
    the alternate term is quoted or policy-required.
  rationale: Mixed scales invite readers to assign unintended differences or equivalences.
  default_states:
    ASSESS: required
    SPECIFY: advisory
    TRANSFORM: required
  severity: major
  detector_classes:
  - D0
  required_inputs:
  - text
  - force_lexicon
  - policy
  protected_impact:
