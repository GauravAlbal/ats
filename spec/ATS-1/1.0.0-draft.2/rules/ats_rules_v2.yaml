- schema_version: ats.rule.v1
  rule_id: ATS-DEON-003
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: SHOULD means defeasible recommendation
  category: deontics
  normative_statement: '`SHOULD` and `SHOULD NOT` MUST express defeasible recommendation, not an unstated
    forecast or uncertainty about importance.'
  rationale: Using SHOULD as vague uncertainty obscures both analytic and normative force.
  default_states:
    ASSESS: advisory
    SPECIFY: required
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D0
  - D3
  - D4
  required_inputs:
