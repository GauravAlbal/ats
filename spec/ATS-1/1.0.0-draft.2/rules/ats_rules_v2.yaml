schema_version: ats.ruleset.v2
standard: ATS-1
spec_version: 1.0.0-draft.2
rules:
- schema_version: ats.rule.v1
  rule_id: ATS-TERM-001
  operational_class: review_required
  rule_version: 1.0.0-draft.1
  title: Canonical term per concept
  category: terminology
  normative_statement: Within one scope, a concept MUST use one canonical term unless an explicit contrast,
    quotation, or alias mapping justifies another term.
  rationale: Synonym drift increases referential ambiguity and makes readers reconstruct whether two labels
    denote the same object.
  default_states:
    ASSESS: advisory
    SPECIFY: advisory
    TRANSFORM: advisory
  severity: major
  detector_classes:
  - D1
  - D3
  required_inputs:
  - text
  - profile
  - glossary
  protected_impact:
  - P1
  - P2
  autofix: review_required
  waivable: true
  exceptions: []
  fixture_requirements: &id001
  - conforming
  - violation
  - hard_negative
  - exception
- schema_version: ats.rule.v1
  rule_id: ATS-TERM-002
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: Preserve exact domain terms
  category: terminology
  normative_statement: A precise approved domain term MUST NOT be replaced solely to use more common vocabulary
    when the substitute changes or broadens meaning.
  rationale: Lexical simplicity is harmful when it removes a canonical technical distinction.
  default_states:
    ASSESS: advisory
    SPECIFY: advisory
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D3
  - D4
  required_inputs:
  - text
  - profile
  - glossary
  - source_text
  protected_impact:
  - P0
  - P1
  autofix: forbidden
  waivable: true
  exceptions: []
  fixture_requirements: *id001
- schema_version: ats.rule.v1
  rule_id: ATS-TERM-003
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: Expand acronyms on first material use
  category: terminology
  normative_statement: An acronym or abbreviation MUST be expanded on first material use unless the audience
    policy or glossary explicitly permits it.
  rationale: Acronym expansion lowers lookup cost without banning domain terminology.
  default_states:
    ASSESS: required
    SPECIFY: required
    TRANSFORM: required
  severity: minor
  detector_classes:
  - D0
  - D1
  required_inputs:
  - text
  - profile
  - audience
  - glossary
  protected_impact:
  - P2
  autofix: safe_p2
  waivable: true
  exceptions: []
  fixture_requirements: *id001
- schema_version: ats.rule.v1
  rule_id: ATS-REF-001
  operational_class: review_required
  rule_version: 1.0.0-draft.1
  title: Unambiguous material references
  category: reference
  normative_statement: A material pronoun, demonstrative, or elliptical reference MUST have one plausible
    antecedent.
  rationale: Ambiguous reference can transfer a condition, action, or judgment to the wrong object.
  default_states:
    ASSESS: advisory
    SPECIFY: required
    TRANSFORM: required
  severity: major
  detector_classes:
  - D1
  - D3
  required_inputs:
  - text
  - syntax
  - profile
  protected_impact:
  - P0
  - P1
  autofix: review_required
  waivable: true
  exceptions: []
  fixture_requirements: *id001
- schema_version: ats.rule.v1
  rule_id: ATS-SCOPE-001
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: Explicit action-relevant scope
  category: scope
  normative_statement: Material quantifier, negation, condition, exclusion, and scope relationships MUST
    be explicit enough to admit one action-relevant interpretation.
  rationale: Scope ambiguity is a common path from readable prose to wrong action.
  default_states:
    ASSESS: advisory
    SPECIFY: required
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D1
  - D3
  - D4
  required_inputs:
  - text
  - syntax
  - meaning_ledger
  - profile
  protected_impact:
  - P0
  - P1
  autofix: review_required
  waivable: true
  exceptions: []
  fixture_requirements: *id001
- schema_version: ats.rule.v1
  rule_id: ATS-NUM-001
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: Units and dimensions for material numbers
  category: quantity
  normative_statement: A material number MUST include its unit, dimension, denominator, or explicit dimensionless
    status.
  rationale: A bare number cannot be interpreted or verified reliably.
  default_states:
    ASSESS: required
    SPECIFY: required
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D0
  - D1
  - D4
  required_inputs:
  - text
  - meaning_ledger
  protected_impact:
  - P0
  autofix: review_required
  waivable: true
  exceptions: []
  fixture_requirements: *id001
- schema_version: ats.rule.v1
  rule_id: ATS-NUM-002
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: Explicit range and threshold boundaries
  category: quantity
  normative_statement: A material range or threshold MUST define comparator and boundary semantics when
    ordinary language is ambiguous.
  rationale: Boundary errors directly change acceptance and behavior.
  default_states:
    ASSESS: required
    SPECIFY: required
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D0
  - D1
  - D4
  required_inputs:
  - text
  - meaning_ledger
  protected_impact:
  - P0
  autofix: review_required
  waivable: true
  exceptions: []
  fixture_requirements: *id001
- schema_version: ats.rule.v1
  rule_id: ATS-TIME-001
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: Time horizon for forecasts
  category: time
  normative_statement: A material forecast or temporally bounded judgment MUST state a resolution date,
    event, or time horizon.
  rationale: Probability without a horizon is not a stable proposition.
  default_states:
    ASSESS: required
    SPECIFY: advisory
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D0
  - D1
  - D3
  - D4
  required_inputs:
  - text
  - profile
  - meaning_ledger
  protected_impact:
  - P0
  autofix: review_required
  waivable: true
  exceptions: []
  fixture_requirements: *id001
- schema_version: ats.rule.v1
  rule_id: ATS-TIME-002
  operational_class: review_required
  rule_version: 1.0.0-draft.1
  title: Anchor material relative time
  category: time
  normative_statement: A material relative-time expression MUST resolve to an absolute date, event, version,
    or policy snapshot.
  rationale: Long-lived artifacts otherwise change meaning as time passes.
  default_states:
    ASSESS: required
    SPECIFY: required
    TRANSFORM: required
  severity: major
  detector_classes:
  - D0
  - D1
  - D4
  required_inputs:
  - text
  - metadata
  - policy
  protected_impact:
  - P0
  autofix: review_required
  waivable: true
  exceptions: []
  fixture_requirements: *id001
- schema_version: ats.rule.v1
  rule_id: ATS-PRES-001
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: Preserve retained P0 fields exactly
  category: preservation
  normative_statement: A transformation MUST preserve all retained P0 fields exactly unless an authorized
    semantic change records the delta.
  rationale: Exact fields such as probability, modality, numbers, and source attribution cannot be traded
    for surface fluency.
  default_states:
    ASSESS: disabled
    SPECIFY: disabled
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D0
  - D4
  required_inputs:
  - source_ir
  - output_ir
  - retention_contract
  - authorizations
  protected_impact:
  - P0
  autofix: forbidden
  waivable: false
  exceptions: []
  fixture_requirements: *id001
- schema_version: ats.rule.v1
  rule_id: ATS-EPI-001
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: Canonical likelihood expression
  category: epistemics
  normative_statement: A material probabilistic judgment MUST use the canonical ATS-1 WEP vocabulary or
    a justified numeric point probability.
  rationale: Calibrated terms reduce reader-specific interpretation drift.
  default_states:
    ASSESS: required
    SPECIFY: advisory
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D0
  - D3
  - D4
  required_inputs:
  - text
  - profile
  - force_lexicon
  - meaning_ledger
  protected_impact:
  - P0
  autofix: review_required
  waivable: true
  exceptions: []
  fixture_requirements: *id001
- schema_version: ats.rule.v1
  rule_id: ATS-EPI-002
  operational_class: review_required
  rule_version: 1.0.0-draft.1
  title: Show WEP range on first material use
  category: epistemics
  normative_statement: The first material WEP use in a section MUST include its numeric display range
    inline.
  rationale: Inline ranges make the intended probability scale available at the point of interpretation.
  default_states:
    ASSESS: required
    SPECIFY: advisory
    TRANSFORM: required
  severity: major
  detector_classes:
  - D0
  - D1
  - D4
  required_inputs:
  - text
  - document_ast
  - force_lexicon
