  - conforming
  - violation
  - hard_negative
  - exception
- schema_version: ats.rule.v1
  rule_id: ATS-BASIS-001
  operational_class: review_required
  rule_version: 1.0.0-draft.2
  title: Declare semantic basis where material
  category: basis
  normative_statement: Material semantic values SHOULD declare their basis, and a declared basis
    MUST be one of EXPLICIT, DERIVED, INFERRED, UNAVAILABLE, or AUTHOR_JUDGMENT.
  rationale: A declared basis distinguishes source truth from author judgment; without it
    a reader or transformer cannot tell whether a value is extractable fact or
    constructed semantics, so verification and safe transformation are
    impossible.
  default_states:
    ASSESS: advisory
    SPECIFY: advisory
    TRANSFORM: required
  severity: major
  detector_classes:
