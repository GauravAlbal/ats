- schema_version: ats.rule.v1
  rule_id: ATS-EVID-001
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: Distinguish epistemic and normative roles
  category: evidence
  normative_statement: Observation, sourced report, assumption, inference, judgment, forecast, recommendation,
    and requirement MUST be distinguishable when their difference is material.
  rationale: Fluent prose often conceals unsupported transitions among these roles.
  default_states:
    ASSESS: required
    SPECIFY: required
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D1
  - D3
  - D4
  required_inputs:
  - text
  - profile
  - meaning_ledger
  protected_impact:
