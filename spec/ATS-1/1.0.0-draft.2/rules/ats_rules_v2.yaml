- schema_version: ats.rule.v1
  rule_id: ATS-EPI-006
  operational_class: review_required
  rule_version: 1.0.0-draft.1
  title: State update or reversal indicators
  category: epistemics
  normative_statement: A material assessment MUST identify an observable update or reversal indicator,
    or state why none is available.
  rationale: Indicators make judgments operationally revisable rather than rhetorically final.
  default_states:
    ASSESS: required
    SPECIFY: advisory
    TRANSFORM: required
  severity: major
