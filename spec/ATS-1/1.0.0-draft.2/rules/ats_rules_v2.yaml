  rule_id: ATS-EVID-003
  operational_class: review_required
  rule_version: 1.0.0-draft.1
  title: Address contrary evidence and live alternatives
  category: evidence
  normative_statement: A material assessment MUST identify contrary evidence and live alternatives, or
    state the exact search and applicability status.
  rationale: An assessment is difficult to calibrate when only supporting evidence is visible.
  default_states:
    ASSESS: required
    SPECIFY: advisory
