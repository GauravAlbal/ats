- schema_version: ats.rule.v1
  rule_id: ATS-REQ-001
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: Explicit responsible actor
  category: requirements
  normative_statement: Every material requirement MUST identify the responsible actor explicitly or through
    a mechanically unambiguous inherited block.
  rationale: Responsibility and authority cannot be verified when the actor is hidden.
  default_states:
    ASSESS: disabled
    SPECIFY: required
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D1
  - D3
  - D4
  required_inputs:
  - text
