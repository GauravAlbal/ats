- schema_version: ats.rule.v1
  rule_id: ATS-REQ-003
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: Resolve applicable requirement slots
  category: requirements
  normative_statement: Every applicable requirement slot—scope, trigger, condition, timing, constraint,
    exception, and acceptance criterion—MUST be explicit or referenced.
  rationale: Missing slots force implementers to invent behavior or acceptance criteria.
  default_states:
    ASSESS: disabled
    SPECIFY: required
    TRANSFORM: required
  severity: critical
  detector_classes:
