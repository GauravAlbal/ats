- schema_version: ats.rule.v1
  rule_id: ATS-COORD-002
  operational_class: block
  rule_version: 1.0.0-draft.2
  title: Stable coordinate integrity
  category: coordinates
  normative_statement: Stable semantic coordinates MUST be unique within an artifact, and every
    reference to a coordinate (dependency target, acceptance-criterion
    reference, cross-document authority reference) MUST resolve to a declared
    coordinate.
  rationale: Duplicate coordinates make reference resolution ambiguous, and dangling
    references silently decouple acceptance criteria, dependency targets, and
    cross-document authority links from their declared targets, corrupting joins
    without any explicit signal.
  default_states:
    ASSESS: advisory
    SPECIFY: required
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D1
  required_inputs:
  - ir_document
  - stable_coordinates
  - profile
  protected_impact:
  - P0
  autofix: forbidden
  waivable: false
  exceptions: []
