- schema_version: ats.rule.v1
  rule_id: ATS-DISC-003
  operational_class: advisory
  rule_version: 1.0.0-draft.2
  title: Restatements must add function
  category: discourse
  normative_statement: Restatements MUST add function. Zero-information repetition — the same
    proposition restated without adding a semantic role, locality, or extraction
    benefit — is a defect. Locality-preserving redundancy is not
    zero-information repetition and is permitted.
  rationale: Repeated paraphrase increases orientation cost and can create pseudo-evidence.
  default_states:
    ASSESS: advisory
    SPECIFY: advisory
    TRANSFORM: advisory
  severity: minor
  detector_classes:
  - D3
  required_inputs:
