- schema_version: ats.rule.v1
  rule_id: ATS-EVID-002
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: Match evidence and causal wording to the basis
  category: evidence
  normative_statement: Evidential and causal wording MUST NOT exceed the basis described or referenced
    by the artifact.
  rationale: Overclaim converts compatible evidence into unjustified support or causality.
  default_states:
    ASSESS: advisory
    SPECIFY: advisory
    TRANSFORM: required
  severity: critical
