- schema_version: ats.rule.v1
  rule_id: ATS-COORD-001
  operational_class: block
  rule_version: 1.0.0-draft.2
  title: Stable coordinate preservation
  category: coordinates
  normative_statement: A stable semantic coordinate declared in a source artifact MUST survive a
    transformation exactly, including when the associated proposition remains
    recoverable through another coordinate.
  rationale: A coordinate is a join key across specification, planning, task
    decomposition, acceptance criteria, implementation, tests, review, receipts,
    postmortems, and later amendments; semantic equivalence of the proposition
    does not recover authority, lifecycle, dependency, execution, verification,
    or evidence roles, so losing the coordinate breaks the model even when the
    wording survives.
  default_states:
    ASSESS: advisory
    SPECIFY: required
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D1
  required_inputs:
  - ir_document
  - stable_coordinates
  - profile
  protected_impact:
  - P0
