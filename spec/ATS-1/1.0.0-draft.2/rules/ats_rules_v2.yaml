- schema_version: ats.rule.v1
  rule_id: ATS-EPI-007
  operational_class: review_required
  rule_version: 1.0.0-draft.1
  title: Do not use possibility terms as the only probability
  category: epistemics
  normative_statement: “Possible,” “plausible,” “might,” and “could” MUST NOT serve as the only likelihood
    expression for a material probabilistic judgment.
  rationale: These words do not map to one calibrated probability range.
  default_states:
    ASSESS: required
    SPECIFY: advisory
    TRANSFORM: required
  severity: major
  detector_classes:
