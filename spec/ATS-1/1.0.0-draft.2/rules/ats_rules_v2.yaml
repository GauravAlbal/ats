- schema_version: ats.rule.v1
  rule_id: ATS-DEON-001
  operational_class: block
  rule_version: 1.0.0-draft.1
  title: Use defined deontic force
  category: deontics
  normative_statement: Normative statements MUST use ATS-1 deontic terms with their defined force; lowercase
    or alternate modals MUST NOT carry hidden normative meaning.
  rationale: Requirements become unverifiable when obligation strength is encoded through conversational
    wording.
  default_states:
    ASSESS: advisory
    SPECIFY: required
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D0
  - D1
  - D3
  - D4
  required_inputs:
  - text
  - profile
  - force_lexicon
  protected_impact:
  - P0
