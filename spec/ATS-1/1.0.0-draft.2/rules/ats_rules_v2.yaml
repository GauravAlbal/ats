  - exception
- schema_version: ats.rule.v1
  rule_id: ATS-BASIS-002
  operational_class: block
  rule_version: 1.0.0-draft.2
  title: No silent promotion of inferred or unavailable semantics
  category: basis
  normative_statement: A transformation MUST NOT silently convert INFERRED or UNAVAILABLE source
    material into an explicit source-authoritative semantic fact.
  rationale: Silently promoting inferred or unavailable material into an explicit
    source-authoritative fact falsifies the semantic record; downstream
    consumers rely on authority, confidence, deontic force, and settlement state
    that the source never granted, and no reviewer gets a chance to object.
  default_states:
    ASSESS: advisory
    SPECIFY: advisory
    TRANSFORM: required
  severity: critical
  detector_classes:
  - D1
  required_inputs:
  - source_ir
  - output_ir
  - profile
  protected_impact:
  - P0
  autofix: forbidden
  waivable: false
  exceptions: []
