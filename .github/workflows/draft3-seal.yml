name: Seal ATS-1 draft.3

# Re-running this workflow with draft.3 already present is an idempotency check:
# regeneration must produce zero package diff.
on:
  push:
    branches: [draft3-seal]

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    env:
      PIP_CONFIG_FILE: /dev/null
      PYTHONNOUSERSITE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out sealing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: draft3-seal

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Synchronize locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.8
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Build draft.3 from sealed draft.2
        run: python tools/build_draft3.py

      - name: Validate sealed packages
        run: |
          (cd spec/ATS-1/1.0.0-draft.1 && python tools/validate_package.py)
          (cd spec/ATS-1/1.0.0-draft.2 && python tools/validate_package.py)
          (cd spec/ATS-1/1.0.0-draft.3 && python tools/validate_package.py)
          python tools/validate_repo.py

      - name: Verify draft.1 and draft.2 are untouched
        run: |
          git diff --exit-code origin/master -- spec/ATS-1/1.0.0-draft.1 spec/ATS-1/1.0.0-draft.2

      - name: Run relevant repository tests
        run: |
          python -m pytest -q tests/unit/test_package.py tests/unit/test_draft2_package.py tests/unit/test_publication_gate.py

      - name: Commit generated sealed package
        run: |
          # The builder also stages the future public-gate edit in the worktree so it can
          # be exercised before cutover. The Actions token deliberately does not own
          # workflow-file mutation; discard that local edit here and publish only the
          # sealed normative package. The authorized connector lands the gate edit later.
          git checkout -- .github/workflows/public-ci.yml
          git add spec/ATS-1/1.0.0-draft.3
          if git diff --cached --quiet; then
            echo "draft.3 already generated and current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Seal ATS-1 1.0.0-draft.3"
          git push origin HEAD:draft3-seal
