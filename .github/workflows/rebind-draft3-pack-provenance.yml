name: Rebind draft3 pack provenance
on:
  push:
    branches: [draft3-pack-provenance]
permissions:
  contents: write
jobs:
  rebind:
    runs-on: ubuntu-latest
    env:
      PIP_CONFIG_FILE: /dev/null
      PYTHONNOUSERSITE: "1"
      PYTHONHASHSEED: "0"
      SOURCE_COMMIT: 70ddb27c12df8fbd426730ce92ef03f4040bb0d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: draft3-pack-provenance
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Synchronize locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.8
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Rebind pack to merged source
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from ats.skill_pack import git_source_identity, write_pack
          repo = Path.cwd()
          source_commit, generated_at = git_source_identity(repo)
          assert source_commit == os.environ['SOURCE_COMMIT']
          manifest = write_pack(repo, repo / 'dist' / 'skill-pack', now=generated_at, source_commit=source_commit)
          assert manifest['source_commit'] == os.environ['SOURCE_COMMIT']
          assert manifest['skill_pack_version'] == '0.1.4'
          assert manifest['implementation_version'] == '0.5.0'
          assert manifest['standard_versions_supported'] == {
              'new_authoring': '1.0.0-draft.3',
              'legacy_interpretation': '1.0.0-draft.1',
          }
          PY
      - name: Prove deterministic replay and publication gates
        run: |
          rm -rf "$RUNNER_TEMP/pack-first"
          cp -a dist/skill-pack "$RUNNER_TEMP/pack-first"
          python - <<'PY'
          from pathlib import Path
          from ats.skill_pack import git_source_identity, write_pack
          repo = Path.cwd()
          source_commit, generated_at = git_source_identity(repo)
          write_pack(repo, repo / 'dist' / 'skill-pack', now=generated_at, source_commit=source_commit)
          PY
          diff -qr "$RUNNER_TEMP/pack-first" dist/skill-pack
          python tools/validate_repo.py
          python -m ats.cli skills verify --pack dist/skill-pack
          python tools/smoke_cli.py
          python -m pytest -q tests/unit/test_skill_pack.py tests/unit/test_publication_gate.py tests/capstone/test_oss_skill_pack.py
      - name: Commit durable provenance bytes
        run: |
          git add dist/skill-pack
          git diff --cached --quiet && { echo 'already durable'; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebind skill pack 0.1.4 to merged draft3 source"
          git push origin HEAD:draft3-pack-provenance
