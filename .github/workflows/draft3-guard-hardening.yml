name: Harden draft3 default guard
on:
  push:
    branches: [draft3-authoring-default]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    env:
      PIP_CONFIG_FILE: /dev/null
      PYTHONNOUSERSITE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: draft3-authoring-default
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Harden stale-draft1 binding check
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ats/skill_pack.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _stale_draft1_findings(text: str, rel: str) -> list[Finding]:\n    \"\"\"No instruction telling new authoring to use the legacy draft.1 edition.\n\n    The check is deliberately line-local. Mentioning both defaults on one line is\n    legitimate when that same line also names the currently declared new-authoring\n    edition. This follows STANDARD_VERSIONS_SUPPORTED rather than hardcoding draft.2.\n    \"\"\"\n    findings: list[Finding] = []\n    current = STANDARD_VERSIONS_SUPPORTED[\"new_authoring\"]\n    for line in text.splitlines():\n        if (\n            re.search(r\"new(?: durable)? authoring\", line, re.IGNORECASE)\n            and \"1.0.0-draft.1\" in line\n            and current not in line\n        ):\n            findings.append(Finding(\"DRAFT1-DEFAULT\", \"language ties new authoring to draft.1\", file=rel))\n    return findings\n'''
          new = '''def _stale_draft1_findings(text: str, rel: str) -> list[Finding]:\n    \"\"\"No instruction binding new authoring to the legacy draft.1 edition.\n\n    Evaluate clause-local bindings rather than treating the mere presence of the\n    current edition elsewhere on a line as exculpatory. This permits the canonical\n    two-default construction (new authoring -> current edition; legacy -> draft.1)\n    while still catching contradictory clauses that bind new authoring to draft.1.\n    \"\"\"\n    findings: list[Finding] = []\n    new_authoring = re.compile(r\"new(?: durable)? authoring\", re.IGNORECASE)\n    clause_break = re.compile(r\";|[!?](?=\\s|$)|\\.(?=\\s+[A-Z]|\\s*$)\")\n    for line in text.splitlines():\n        for clause in clause_break.split(line):\n            if new_authoring.search(clause) and \"1.0.0-draft.1\" in clause:\n                findings.append(\n                    Finding(\"DRAFT1-DEFAULT\", \"language ties new authoring to draft.1\", file=rel)\n                )\n    return findings\n'''
          if text.count(old) != 1:
              raise SystemExit(f'function anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/unit/test_skill_pack.py')
          text = tests.read_text(encoding='utf-8')
          old_test = '''    stale = \"New durable authoring uses ATS-1 1.0.0-draft.1.\"\n    assert _stale_draft1_findings(legitimate, \"legitimate.md\") == []\n    findings = _stale_draft1_findings(stale, \"stale.md\")\n    assert [finding.code for finding in findings] == [\"DRAFT1-DEFAULT\"]\n'''
          new_test = '''    stale = \"New durable authoring uses ATS-1 1.0.0-draft.1.\"\n    contradictory = (\n        \"New durable authoring uses ATS-1 1.0.0-draft.1; \"\n        \"1.0.0-draft.3 is unsupported.\"\n    )\n    assert _stale_draft1_findings(legitimate, \"legitimate.md\") == []\n    findings = _stale_draft1_findings(stale, \"stale.md\")\n    assert [finding.code for finding in findings] == [\"DRAFT1-DEFAULT\"]\n    contradictory_findings = _stale_draft1_findings(contradictory, \"contradictory.md\")\n    assert [finding.code for finding in contradictory_findings] == [\"DRAFT1-DEFAULT\"]\n'''
          if text.count(old_test) != 1:
              raise SystemExit(f'test anchor count={text.count(old_test)}')
          tests.write_text(text.replace(old_test, new_test, 1), encoding='utf-8')
          PY
      - name: Synchronize locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.8
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Gate hardened verifier
        run: |
          python -m pytest -q tests/unit/test_skill_pack.py tests/unit/test_cli_spec_defaults.py
          python -m ats.cli skills verify --pack dist/skill-pack
      - name: Commit hardened verifier
        run: |
          git add src/ats/skill_pack.py tests/unit/test_skill_pack.py
          git diff --cached --quiet && { echo 'already current'; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden draft3 new-authoring default guard"
          git push origin HEAD:draft3-authoring-default
