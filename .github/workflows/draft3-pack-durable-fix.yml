name: Commit draft3 pack verifier compatibility
on:
  push:
    branches: [draft3-authoring-default]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      PIP_CONFIG_FILE: /dev/null
      PYTHONNOUSERSITE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: draft3-authoring-default
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Patch durable pack verifier and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: anchor count {text.count(old)} for {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          pack = Path('src/ats/skill_pack.py')
          one(pack, '    "new_authoring": "1.0.0-draft.2",', '    "new_authoring": "1.0.0-draft.3",')
          one(
              pack,
              '                f"!= {STANDARD_VERSIONS_SUPPORTED!r} (new authoring must be draft.2)",',
              '                f"!= {STANDARD_VERSIONS_SUPPORTED!r} (new authoring must be {STANDARD_VERSIONS_SUPPORTED[\'new_authoring\']})",',
          )
          old_fn = '''def _stale_draft1_findings(text: str, rel: str) -> list[Finding]:\n    \"\"\"No instruction telling new authoring to use draft.1.\n\n    Matched per line. A \"new authoring … draft.1\" adjacency is legitimate only\n    in the two-default construction, where draft.2 sits between the mentions\n    (new authoring resolves draft.2; legacy stays draft.1); flagging requires\n    the draft.1 mention to be bound to new authoring without an intervening\n    draft.2.\n    \"\"\"\n    findings: list[Finding] = []\n    for match in re.finditer(r\"new(?: durable)? authoring\", text, re.IGNORECASE):\n        window = text[match.end() : match.end() + 200].split(\"\\n\", 1)[0]\n        draft1 = re.search(r\"1\\.0\\.0-draft\\.1\", window)\n        if draft1 and not re.search(r\"1\\.0\\.0-draft\\.2\", window[: draft1.start()]):\n            findings.append(Finding(\"DRAFT1-DEFAULT\", \"language ties new authoring to draft.1\", file=rel))\n    for match in re.finditer(r\"1\\.0\\.0-draft\\.1\", text):\n        window = text[match.end() : match.end() + 200].split(\"\\n\", 1)[0]\n        new_auth = re.search(r\"new(?: durable)? authoring\", window, re.IGNORECASE)\n        if new_auth and not re.search(r\"1\\.0\\.0-draft\\.2\", window[: new_auth.start()]):\n            findings.append(Finding(\"DRAFT1-DEFAULT\", \"language ties new authoring to draft.1\", file=rel))\n    return findings\n'''
          new_fn = '''def _stale_draft1_findings(text: str, rel: str) -> list[Finding]:\n    \"\"\"No instruction telling new authoring to use the legacy draft.1 edition.\n\n    The check is deliberately line-local. Mentioning both defaults on one line is\n    legitimate when that same line also names the currently declared new-authoring\n    edition. This follows STANDARD_VERSIONS_SUPPORTED rather than hardcoding draft.2.\n    \"\"\"\n    findings: list[Finding] = []\n    current = STANDARD_VERSIONS_SUPPORTED[\"new_authoring\"]\n    for line in text.splitlines():\n        if (\n            re.search(r\"new(?: durable)? authoring\", line, re.IGNORECASE)\n            and \"1.0.0-draft.1\" in line\n            and current not in line\n        ):\n            findings.append(Finding(\"DRAFT1-DEFAULT\", \"language ties new authoring to draft.1\", file=rel))\n    return findings\n'''
          one(pack, old_fn, new_fn)

          tests = Path('tests/unit/test_skill_pack.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              'assert manifest["skill_pack_version"] == SKILL_PACK_VERSION == "0.1.3"',
              'assert manifest["skill_pack_version"] == SKILL_PACK_VERSION == "0.1.4"',
          )
          text = text.replace(
              'assert manifest["standard_versions_supported"]["new_authoring"] == "1.0.0-draft.2"',
              'assert manifest["standard_versions_supported"]["new_authoring"] == "1.0.0-draft.3"',
          )
          text = text.replace(
              'New durable authoring** resolves ATS-1 `1.0.0-draft.2`',
              'New durable authoring** resolves ATS-1 `1.0.0-draft.3`',
          )
          durable = '''\n\ndef test_two_default_guard_follows_current_new_authoring_edition() -> None:\n    from ats.skill_pack import _stale_draft1_findings\n\n    assert STANDARD_VERSIONS_SUPPORTED == {\n        "new_authoring": "1.0.0-draft.3",\n        "legacy_interpretation": "1.0.0-draft.1",\n    }\n    legitimate = (\n        "New durable authoring resolves ATS-1 1.0.0-draft.3; "\n        "legacy material stays ATS-1 1.0.0-draft.1."\n    )\n    stale = "New durable authoring uses ATS-1 1.0.0-draft.1."\n    assert _stale_draft1_findings(legitimate, "legitimate.md") == []\n    findings = _stale_draft1_findings(stale, "stale.md")\n    assert [finding.code for finding in findings] == ["DRAFT1-DEFAULT"]\n'''
          if 'def test_two_default_guard_follows_current_new_authoring_edition' not in text:
              text += durable
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Synchronize locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.8
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Gate durable source
        run: |
          python - <<'PY'
          from ats.skill_pack import STANDARD_VERSIONS_SUPPORTED, _stale_draft1_findings
          assert STANDARD_VERSIONS_SUPPORTED == {'new_authoring':'1.0.0-draft.3','legacy_interpretation':'1.0.0-draft.1'}
          assert _stale_draft1_findings('New durable authoring resolves ATS-1 1.0.0-draft.3; legacy material stays 1.0.0-draft.1.', 'ok.md') == []
          assert len(_stale_draft1_findings('New durable authoring uses ATS-1 1.0.0-draft.1.', 'bad.md')) == 1
          PY
          python -m pytest -q tests/unit/test_cli_spec_defaults.py tests/unit/test_skill_pack.py tests/unit/test_draft3_package.py
      - name: Commit durable source
        run: |
          git add src/ats/skill_pack.py tests/unit/test_skill_pack.py
          git diff --cached --quiet && { echo 'already current'; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make skill-pack version law follow draft3"
          git push origin HEAD:draft3-authoring-default
