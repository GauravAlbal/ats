name: Normalize draft3 on ats 0.5.0
on:
  push:
    branches: [draft3-seal]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    env:
      PIP_CONFIG_FILE: /dev/null
      PYTHONNOUSERSITE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: draft3-seal
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Restore implementation identity and package binding
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')

          p = root / 'pyproject.toml'
          text = p.read_text(encoding='utf-8')
          text = text.replace('version = "0.5.1"', 'version = "0.5.0"', 1)
          p.write_text(text, encoding='utf-8')

          lock = root / 'uv.lock'
          text = lock.read_text(encoding='utf-8')
          old = 'name = "ats"\nversion = "0.5.1"\nsource = { editable = "." }'
          new = 'name = "ats"\nversion = "0.5.0"\nsource = { editable = "." }'
          if old in text:
              text = text.replace(old, new, 1)
          lock.write_text(text, encoding='utf-8')

          pkg = root / 'spec/ATS-1/1.0.0-draft.3'
          cap = pkg / 'capability/ats_rule_capability_v1.json'
          doc = json.loads(cap.read_text(encoding='utf-8'))
          doc['implementation_version'] = '0.5.0'
          row = next(r for r in doc['rules'] if r['rule_id'] == 'ATS-REQ-004')
          assert row['implemented'] is True
          assert row['detector_class'] == 'D1'
          assert row['decision_power'] == 'detects_violations'
          cap.write_text(json.dumps(doc, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          manifest = pkg / 'MANIFEST.json'
          m = json.loads(manifest.read_text(encoding='utf-8'))
          files = []
          for path in sorted(x for x in pkg.rglob('*') if x.is_file() and x.name != 'MANIFEST.json' and not x.name.endswith('.zip')):
              data = path.read_bytes()
              files.append({'path': path.relative_to(pkg).as_posix(), 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          m['files'] = files
          manifest.write_text(json.dumps(m, indent=1, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Synchronize locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.8
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Run sealing and compatibility gates
        run: |
          python - <<'PY'
          import ats
          assert ats.__version__ == '0.5.0'
          PY
          (cd spec/ATS-1/1.0.0-draft.1 && python tools/validate_package.py)
          (cd spec/ATS-1/1.0.0-draft.2 && python tools/validate_package.py)
          (cd spec/ATS-1/1.0.0-draft.3 && python tools/validate_package.py)
          python - <<'PY'
          import datetime as dt
          from ats.context import Context
          from ats.rules.deterministic import load_detectors
          c = Context.load(spec_version='1.0.0-draft.3', now=dt.datetime(2026,8,3,tzinfo=dt.UTC))
          assert len(c.registry.ids()) == 37
          assert c.capability.coherence_errors() == []
          r = c.capability.for_rule('ATS-REQ-004')
          assert r.implemented is True
          assert r.detector_class == 'D1'
          assert r.decision_power == 'detects_violations'
          assert 'ATS-REQ-004' in load_detectors(c.registry.ids())
          PY
          python tools/validate_repo.py
          python -m ats.cli skills verify --pack dist/skill-pack
          python tools/smoke_cli.py
          python -m pytest -q tests/unit/test_package.py tests/unit/test_draft2_package.py tests/unit/test_draft3_package.py tests/unit/test_capability.py tests/unit/test_skill_pack.py tests/unit/test_publication_gate.py
      - name: Preserve prior normative editions
        run: git diff --exit-code origin/master -- spec/ATS-1/1.0.0-draft.1 spec/ATS-1/1.0.0-draft.2
      - name: Commit normalized bytes
        run: |
          git add pyproject.toml uv.lock spec/ATS-1/1.0.0-draft.3/capability/ats_rule_capability_v1.json spec/ATS-1/1.0.0-draft.3/MANIFEST.json
          if git diff --cached --quiet; then
            echo "implementation identity already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep draft3 compatibility on ats 0.5.0"
          git push origin HEAD:draft3-seal
