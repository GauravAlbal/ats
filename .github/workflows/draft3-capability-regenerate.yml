name: Regenerate 0.5.1 capability
on:
  push:
    branches: [draft3-seal]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: draft3-seal
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --disable-pip-version-check uv==0.11.8
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Regenerate and validate capability
        run: |
          python tools/generate_capability.py
          python tools/validate_repo.py
          python -m pytest -q tests/unit/test_capability.py tests/unit/test_draft3_package.py
      - name: Commit generated capability
        run: |
          git add capability/ats_rule_capability_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate capability for ats 0.5.1"
          git push origin HEAD:draft3-seal
