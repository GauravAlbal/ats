name: Fix draft3 pack contract
# Apply source changes before uv sync so the gate imports the patched project.
on:
  push:
    branches: [draft3-authoring-default]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      PIP_CONFIG_FILE: /dev/null
      PYTHONNOUSERSITE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: draft3-authoring-default
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply pack-contract fixes
        run: python tools/fix_draft3_pack_contract.py
      - name: Synchronize locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.8
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Gate two-default verifier semantics
        run: |
          python - <<'PY'
          from ats.skill_pack import STANDARD_VERSIONS_SUPPORTED, _stale_draft1_findings
          assert STANDARD_VERSIONS_SUPPORTED == {
              'new_authoring': '1.0.0-draft.3',
              'legacy_interpretation': '1.0.0-draft.1',
          }
          ok = 'New durable authoring resolves ATS-1 1.0.0-draft.3; legacy material stays 1.0.0-draft.1.'
          bad = 'New durable authoring uses ATS-1 1.0.0-draft.1.'
          assert _stale_draft1_findings(ok, 'ok.md') == []
          assert len(_stale_draft1_findings(bad, 'bad.md')) == 1
          PY
          python -m pytest -q tests/unit/test_cli_spec_defaults.py tests/unit/test_skill_pack.py tests/unit/test_draft3_package.py
      - name: Commit canonical pack-contract fixes
        run: |
          git add src/ats/skill_pack.py skills/public/ats/SKILL.md
          if git diff --cached --quiet; then
            echo 'pack contract already current'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Carry draft3 two-default law into the skill pack"
          git push origin HEAD:draft3-authoring-default
