name: Generate draft3 skill pack 0.1.4
on:
  push:
    branches: [draft3-authoring-default]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PIP_CONFIG_FILE: /dev/null
      PYTHONNOUSERSITE: "1"
      PYTHONHASHSEED: "0"
      P0_SOURCE_COMMIT: f343211190fdc9b40c198c2157d7882bc47f912a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: draft3-authoring-default
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Synchronize locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.8
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Generate pack from clean P0 source commit
        run: |
          python tools/generate_skill_pack.py --source-commit "$P0_SOURCE_COMMIT"
      - name: Gate generated pack and repository
        run: |
          python -m ats.cli skills verify --pack dist/skill-pack
          python tools/validate_repo.py
          python tools/smoke_cli.py
          python -m pytest -q tests/unit/test_cli_spec_defaults.py tests/unit/test_draft3_package.py tests/unit/test_skill_pack.py tests/unit/test_publication_gate.py tests/capstone/test_oss_skill_pack.py
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('dist/skill-pack/skill-pack-manifest.json').read_text())
          assert m['skill_pack_version'] == '0.1.4'
          assert m['implementation_version'] == '0.5.0'
          assert m['source_commit'] == 'f343211190fdc9b40c198c2157d7882bc47f912a'
          for host in ('generic', 'claude', 'agent-plugins'):
              root = Path('dist/skill-pack') / host
              joined = '\n'.join(p.read_text(encoding='utf-8') for p in root.rglob('SKILL.md'))
              assert '1.0.0-draft.3' in joined
              assert 'New durable authoring' in joined or 'new durable authoring' in joined
          PY
      - name: Prove deterministic regeneration
        run: |
          git diff -- dist/skill-pack > "$RUNNER_TEMP/first.diff"
          python tools/generate_skill_pack.py --source-commit "$P0_SOURCE_COMMIT"
          git diff -- dist/skill-pack > "$RUNNER_TEMP/second.diff"
          cmp "$RUNNER_TEMP/first.diff" "$RUNNER_TEMP/second.diff"
      - name: Commit generated P1 bytes
        run: |
          git add dist/skill-pack
          if git diff --cached --quiet; then
            echo 'skill pack already current'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate public skill pack 0.1.4 for draft3"
          git push origin HEAD:draft3-authoring-default
