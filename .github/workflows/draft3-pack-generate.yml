name: Generate draft3 skill pack 0.1.4
on:
  push:
    branches: [draft3-authoring-default]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PIP_CONFIG_FILE: /dev/null
      PYTHONNOUSERSITE: "1"
      PYTHONHASHSEED: "0"
      P0_SOURCE_COMMIT: 599d32e8795d64e2beb77b11ecbcbcf1c84da30f
      SOURCE_COMMIT: 599d32e8795d64e2beb77b11ecbcbcf1c84da30f
    steps:
      - name: Check out cutover branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: draft3-authoring-default
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Synchronize locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.8
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Prove generator inputs are P0-identical
        run: |
          git cat-file -e "$P0_SOURCE_COMMIT^{commit}"
          git diff --quiet "$P0_SOURCE_COMMIT" HEAD -- \
            src/ats/__init__.py src/ats/skill_pack.py \
            skills/public docs/ARTIFACT_RECIPES.md \
            LICENSES LICENSE.md THIRD_PARTY_NOTICES.md schemas/ats_skill_pack_manifest_v1.schema.json
      - name: Generate pack from exact P0 provenance
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from ats.skill_pack import git_source_identity, write_pack

          repo = Path.cwd()
          source_commit, generated_at = git_source_identity(repo)
          assert source_commit == os.environ["P0_SOURCE_COMMIT"]
          manifest = write_pack(repo, repo / "dist" / "skill-pack", now=generated_at, source_commit=source_commit)
          assert manifest["source_commit"] == os.environ["P0_SOURCE_COMMIT"]
          assert manifest["skill_pack_version"] == "0.1.4"
          assert manifest["implementation_version"] == "0.5.0"
          assert manifest["standard_versions_supported"] == {
              "new_authoring": "1.0.0-draft.3",
              "legacy_interpretation": "1.0.0-draft.1",
          }
          PY
      - name: Prove byte-idempotent regeneration
        run: |
          rm -rf "$RUNNER_TEMP/pack-first"
          cp -a dist/skill-pack "$RUNNER_TEMP/pack-first"
          python - <<'PY'
          from pathlib import Path
          from ats.skill_pack import git_source_identity, write_pack
          repo = Path.cwd()
          source_commit, generated_at = git_source_identity(repo)
          write_pack(repo, repo / "dist" / "skill-pack", now=generated_at, source_commit=source_commit)
          PY
          diff -qr "$RUNNER_TEMP/pack-first" dist/skill-pack
      - name: Run full publication checks on generated bytes
        run: |
          python tools/validate_repo.py
          (cd spec/ATS-1/1.0.0-draft.1 && python tools/validate_package.py)
          (cd spec/ATS-1/1.0.0-draft.2 && python tools/validate_package.py)
          (cd spec/ATS-1/1.0.0-draft.3 && python tools/validate_package.py)
          python -m ats.cli skills verify --pack dist/skill-pack
          python tools/smoke_cli.py
          python -m pytest -q \
            tests/unit/test_package.py \
            tests/unit/test_draft2_package.py \
            tests/unit/test_draft3_package.py \
            tests/unit/test_skill_pack.py \
            tests/unit/test_cli_spec_defaults.py \
            tests/unit/test_publication_gate.py
          python -m pytest -q tests/capstone/test_oss_skill_pack.py
      - name: Commit generated 0.1.4 bytes
        run: |
          git add dist/skill-pack
          git diff --cached --quiet && { echo '0.1.4 already generated and current'; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate skill pack 0.1.4 from draft3 default"
          git push origin HEAD:draft3-authoring-default
