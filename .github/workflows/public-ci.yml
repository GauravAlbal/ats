name: Public publication gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  public-gate:
    runs-on: ubuntu-latest
    env:
      # Keep Python package discovery independent of runner/developer state.
      PIP_CONFIG_FILE: /dev/null
      PYTHONNOUSERSITE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out public tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pack provenance may bind an earlier commit; verify_pack uses git show.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Isolate user directories
        run: |
          mkdir -p \
            "$RUNNER_TEMP/ats-home" \
            "$RUNNER_TEMP/ats-config" \
            "$RUNNER_TEMP/ats-state" \
            "$RUNNER_TEMP/ats-data"
          {
            echo "HOME=$RUNNER_TEMP/ats-home"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/ats-config"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/ats-state"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/ats-data"
          } >> "$GITHUB_ENV"

      - name: Synchronize locked public environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.8
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Run focused publication checks
        run: |
          python tools/validate_repo.py
          (cd spec/ATS-1/1.0.0-draft.1 && python tools/validate_package.py)
          (cd spec/ATS-1/1.0.0-draft.2 && python tools/validate_package.py)
          (cd spec/ATS-1/1.0.0-draft.3 && python tools/validate_package.py)
          python -m ats.cli skills verify --pack dist/skill-pack
          python tools/smoke_cli.py

      - name: Test package provenance, regeneration, and private-dependency guards
        run: >-
          python -m pytest -q
          tests/unit/test_package.py
          tests/unit/test_draft2_package.py
          tests/unit/test_skill_pack.py
          tests/unit/test_publication_gate.py

      - name: Exercise hermetic public capstone
        run: python -m pytest -q tests/capstone/test_oss_skill_pack.py
